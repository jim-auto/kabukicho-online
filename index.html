<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kabukicho Online - ブラウザ版</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050509;
      color: #f7f7ff;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle at center, transparent 42%, rgba(0,0,0,0.46) 100%);
      background-size: 100% 4px, 100% 100%;
      mix-blend-mode: screen;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #050509;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: 16px 16px auto 16px;
      display: grid;
      grid-template-columns: minmax(230px, 330px) minmax(180px, 280px);
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 5;
    }

    .panel {
      border: 1px solid rgba(36, 219, 255, 0.80);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(36, 219, 255, 0.13), transparent 34%),
        rgba(7, 8, 15, 0.78);
      box-shadow: 0 0 24px rgba(36, 219, 255, 0.24), inset 0 0 22px rgba(255, 42, 145, 0.14);
      backdrop-filter: blur(6px);
      padding: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      color: #24dbff;
      text-shadow: 0 0 12px rgba(36, 219, 255, 0.95);
      letter-spacing: 0;
      line-height: 1;
    }

    .sub {
      margin-top: 5px;
      color: #ffe63e;
      font-size: 12px;
      font-weight: 800;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .mission {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.55;
    }

    .mission-bar {
      height: 8px;
      margin-top: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .mission-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #24dbff, #ffe63e, #ff2a91);
      box-shadow: 0 0 14px rgba(255, 230, 62, 0.65);
      transition: width 120ms ease;
    }

    .ranking-title {
      color: #ffe63e;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .rank-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.55;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      min-width: min(620px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      border-radius: 8px;
      background: #ff2a91;
      color: white;
      box-shadow: 0 0 26px rgba(255, 42, 145, 0.65);
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
      z-index: 8;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: grid;
      grid-template-columns: repeat(4, 72px);
      gap: 10px;
      z-index: 7;
    }

    .btn {
      width: 72px;
      height: 64px;
      border: 1px solid rgba(36, 219, 255, 0.9);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(30, 35, 54, 0.94), rgba(8, 10, 18, 0.88));
      color: white;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 0 16px rgba(36, 219, 255, 0.28);
      cursor: pointer;
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 0 24px rgba(255, 42, 145, 0.42);
    }

    .stick {
      position: fixed;
      left: 18px;
      bottom: 20px;
      width: 128px;
      height: 128px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: none;
      z-index: 7;
    }

    .stick::after {
      content: "";
      position: absolute;
      left: 44px;
      top: 44px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(36, 219, 255, 0.72);
      box-shadow: 0 0 18px rgba(36, 219, 255, 0.7);
      transform: translate(var(--knob-x, 0), var(--knob-y, 0));
    }

    .help {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.70);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
      z-index: 6;
    }

    @media (max-width: 760px) {
      .hud {
        inset: 10px 10px auto 10px;
        grid-template-columns: minmax(0, 1fr);
      }

      .ranking {
        display: none;
      }

      .brand {
        font-size: 18px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        font-size: 12px;
      }

      .toast {
        top: 112px;
        font-size: 16px;
      }

      .controls {
        grid-template-columns: repeat(4, 64px);
      }

      .btn {
        width: 64px;
        height: 58px;
        font-size: 12px;
      }

      .stick {
        display: block;
      }

      .help {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <section class="panel">
      <div class="brand">歌舞伎町オンライン</div>
      <div class="sub">ブラウザ版ミニゲーム / Robloxプロトタイプ</div>
      <div class="stats">
        <div>所持金: <span id="money">0</span></div>
        <div>評判: <span id="rep">0</span></div>
        <div>カリスマ: <span id="charisma">1</span></div>
        <div>店ランク: <span id="club">1</span></div>
        <div>迷惑退治: <span id="trouble">0</span></div>
        <div>コンボ: <span id="combo">1.0</span>x</div>
        <div>守った客: <span id="saved">0</span></div>
        <div>逃げた客: <span id="lost">0</span></div>
        <div>連続退治: <span id="streak">0</span></div>
      </div>
      <div class="mission">
        <div id="wave">第1波 / 残り60秒</div>
        <div id="missionText">ミッション準備中</div>
        <div class="mission-bar"><div id="missionFill" class="mission-fill"></div></div>
      </div>
    </section>

    <section class="panel ranking">
      <div class="ranking-title">サーバーランキング</div>
      <div id="ranking"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <div id="stick" class="stick"></div>
  <div class="controls">
    <button id="dash" class="btn" type="button">ダッシュ</button>
    <button id="bonk" class="btn" type="button">ツッコミ</button>
    <button id="pose" class="btn" type="button">ポーズ</button>
    <button id="upgrade" class="btn" type="button">強化</button>
  </div>
  <div class="help">WASD / 矢印: 移動 · 地面クリック/タップ: そこへ移動 · Shift: ダッシュ · Space/F: ツッコミ · E: 近くの相手にアクション</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const els = {
      money: document.getElementById("money"),
      rep: document.getElementById("rep"),
      charisma: document.getElementById("charisma"),
      club: document.getElementById("club"),
      trouble: document.getElementById("trouble"),
      combo: document.getElementById("combo"),
      saved: document.getElementById("saved"),
      lost: document.getElementById("lost"),
      streak: document.getElementById("streak"),
      wave: document.getElementById("wave"),
      missionText: document.getElementById("missionText"),
      missionFill: document.getElementById("missionFill"),
      ranking: document.getElementById("ranking"),
      toast: document.getElementById("toast"),
      stick: document.getElementById("stick"),
      dash: document.getElementById("dash"),
      bonk: document.getElementById("bonk"),
      pose: document.getElementById("pose"),
      upgrade: document.getElementById("upgrade"),
    };

    const neon = ["#ff2a91", "#24dbff", "#ffe63e", "#5bff7b", "#ff742a"];
    const customerLabels = ["ネオン客", "配信者客", "観光VIP", "バズりダンサー", "迷子の会社員"];
    const troubleLabels = ["クソ客", "迷惑ナンパ", "メシ詐欺", "金せびり", "罵倒客"];
    const rankingNames = ["ネオン王", "バズホスト", "ツッコミ番長", "看板スター", "カオス小僧"];
    const world = { w: 2200, h: 1500 };
    const keys = new Set();
    const particles = [];
    const shockwaves = [];
    const hitSparks = [];
    const npcs = [];
    const signs = [];
    const buildings = [];
    const rain = [];
    const cityBackground = new Image();
    cityBackground.src = "assets/generated/neon-city-bg.png";
    const sprites = {
      player: new Image(),
      customer: new Image(),
      customerFemale: new Image(),
      trouble: new Image(),
      troubleFemale: new Image(),
    };
    sprites.player.src = "assets/characters/player-host.png";
    sprites.customer.src = "assets/characters/customer.png";
    sprites.customerFemale.src = "assets/characters/customer-female.png";
    sprites.trouble.src = "assets/characters/troublemaker.png";
    sprites.troubleFemale.src = "assets/characters/troublemaker-female.png";

    let dpr = 1;
    let last = performance.now();
    let toastUntil = 0;
    let chaosUntil = 0;
    let nextChaos = 12;
    let poseUntil = 0;
    let dashUntil = 0;
    let dashCooldown = 0;
    let bonkCooldown = 0;
    let lastInteraction = null;
    let touchMove = { x: 0, y: 0 };
    let playerMoving = false;
    let playerWalkTime = 0;
    let afterImages = [];
    let moveTarget = null;
    let hitStopUntil = 0;
    let screenShakeUntil = 0;
    let screenShakePower = 0;
    let finisherText = null;
    const cameraState = { x: 0, y: 0 };
    let audioContext = null;
    let mission = null;
    let wave = 1;
    let waveEndsAt = performance.now() + 60000;
    let scoutedThisWave = 0;
    let clearedThisWave = 0;
    let upgradedThisWave = 0;
    let nextNpcId = 1;
    let savedCustomers = 0;
    let lostCustomers = 0;
    let comboStreak = 0;
    let comboExpiresAt = 0;

    const player = {
      x: world.w / 2 - 72,
      y: world.h - 260,
      r: 19,
      facing: 0,
      money: 0,
      rep: 0,
      charisma: 1,
      club: 1,
      trouble: 0,
      combo: 1,
      upgradeLevel: 1,
    };

    function bonkRange() {
      return 126 + Math.min(66, player.upgradeLevel * 8);
    }

    function scoutRange() {
      return 72 + Math.min(34, player.upgradeLevel * 4);
    }

    function upgradeBonus() {
      return 1 + Math.min(0.55, (player.upgradeLevel - 1) * 0.08);
    }

    function roadLeft() {
      return world.w / 2 - 315;
    }

    function roadRight() {
      return world.w / 2 + 315;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function showToast(text, color = "#ff2a91") {
      els.toast.textContent = text;
      els.toast.style.background = color;
      els.toast.classList.add("show");
      toastUntil = performance.now() + 1800;
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function playTone(freq, duration, type = "square", volume = 0.08, delay = 0) {
      if (!audioContext) return;
      const start = audioContext.currentTime + delay;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(start);
      osc.stop(start + duration + 0.02);
    }

    function playSfx(kind) {
      ensureAudio();
      if (kind === "hit") {
        playTone(90, 0.07, "sawtooth", 0.16);
        playTone(520, 0.09, "square", 0.10, 0.02);
        playTone(980, 0.12, "triangle", 0.08, 0.04);
      } else if (kind === "scout") {
        playTone(540, 0.08, "triangle", 0.07);
        playTone(820, 0.10, "triangle", 0.07, 0.07);
      } else if (kind === "upgrade") {
        playTone(420, 0.07, "square", 0.08);
        playTone(680, 0.08, "square", 0.08, 0.06);
        playTone(980, 0.12, "square", 0.08, 0.12);
      } else if (kind === "wave") {
        playTone(220, 0.09, "sawtooth", 0.08);
        playTone(440, 0.09, "sawtooth", 0.08, 0.08);
      }
    }

    function spawnParticle(x, y, text, color) {
      particles.push({ x, y, text, color, life: 1, maxLife: 1, vy: -60, vx: rand(-24, 24), size: 20 });
    }

    function spawnHitImpact(x, y, label, points) {
      const now = performance.now();
      hitStopUntil = now + 80;
      screenShakeUntil = now + 360;
      screenShakePower = Math.min(20, 10 + points * 4);
      finisherText = { text: `${label}退場！`, x, y: y - 96, until: now + 820 };
      shockwaves.push({ x, y, life: 0.42, maxLife: 0.42, color: "#ffef63" });
      shockwaves.push({ x, y, life: 0.30, maxLife: 0.30, color: "#ff472d" });

      for (let i = 0; i < 18; i += 1) {
        const angle = (Math.PI * 2 * i) / 18 + rand(-0.12, 0.12);
        const speed = rand(120, 260);
        hitSparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.22, 0.42),
          maxLife: 0.42,
          color: i % 3 === 0 ? "#ffffff" : (i % 2 === 0 ? "#ffef63" : "#ff472d"),
        });
      }

      particles.push({ x, y: y - 52, text: `迷惑退治+${points}`, color: "#ffef63", life: 0.92, maxLife: 0.92, vy: -92, vx: rand(-18, 18), size: 30 });
      playSfx("hit");
    }

    function createNpc(type) {
      const trouble = type === "trouble";
      return {
        id: nextNpcId += 1,
        type,
        variant: trouble ? (Math.random() < 0.62 ? "female" : "male") : (Math.random() < 0.70 ? "female" : "male"),
        label: trouble ? pick(troubleLabels) : pick(customerLabels),
        x: rand(roadLeft() + 30, roadRight() - 30),
        y: rand(260, world.h - 170),
        r: trouble ? 18 : 16,
        color: trouble ? pick(["#ff472d", "#ff742a", "#ff2a91", "#ffe63e"]) : pick(["#24dbff", "#5bff7b", "#ffe63e", "#ff2a91"]),
        vx: rand(-28, 28),
        vy: rand(-24, 24),
        claimed: false,
        hitUntil: 0,
        knockX: 0,
        knockY: 0,
        aiMode: trouble ? "wander" : "free",
        targetId: null,
        harassedBy: null,
        harassStartedAt: 0,
        nextAnnoyAt: 0,
        savedUntil: 0,
      };
    }

    function resetNpc(npc, type = npc.type) {
      Object.assign(npc, createNpc(type));
    }

    function setupWorld() {
      for (let i = 0; i < 34; i += 1) npcs.push(createNpc("customer"));
      for (let i = 0; i < 12; i += 1) npcs.push(createNpc("trouble"));

      const nearStart = [
        { type: "customer", x: player.x - 86, y: player.y - 42 },
        { type: "customer", x: player.x + 78, y: player.y + 36 },
        { type: "trouble", x: player.x + 112, y: player.y - 28 },
        { type: "trouble", x: player.x - 130, y: player.y + 58 },
      ];
      for (let i = 0; i < nearStart.length; i += 1) {
        npcs[i].type = nearStart[i].type;
        npcs[i].variant = i === 0 || i === 2 ? "female" : "male";
        npcs[i].label = nearStart[i].type === "trouble" ? troubleLabels[i % troubleLabels.length] : customerLabels[i % customerLabels.length];
        npcs[i].x = nearStart[i].x;
        npcs[i].y = nearStart[i].y;
        npcs[i].color = nearStart[i].type === "trouble" ? "#ff472d" : "#24dbff";
        npcs[i].vx = rand(-12, 12);
        npcs[i].vy = rand(-10, 10);
      }

      for (let y = 120; y < world.h + 220; y += 145) {
        for (const side of [-1, 1]) {
          const depth = 1 - Math.min(0.45, y / world.h * 0.22);
          const w = rand(190, 290) * depth;
          const h = rand(190, 360) * depth;
          const x = world.w / 2 + side * rand(430, 620);
          const windows = [];
          for (let yy = 28; yy < h - 20; yy += 30) {
            for (let xx = 18; xx < w - 18; xx += 30) {
              windows.push({
                x: xx,
                y: yy,
                on: Math.random() < 0.54,
                color: pick(neon),
              });
            }
          }
          buildings.push({ x, y, w, h, side, color: pick(neon), label: pick(["営業中", "No.1", "ネオン", "満席注意"]), windows });
        }
      }

      for (let i = 0; i < 46; i += 1) {
        const side = i % 2 === 0 ? -1 : 1;
        const row = Math.floor(i / 2);
        signs.push({
          x: world.w / 2 + side * rand(430, 620),
          y: 120 + row * 72,
          w: rand(130, 210),
          h: rand(34, 56),
          color: pick(neon),
          text: pick(["ホストバトル", "No.1", "ツッコミSHOW", "客ラッシュ", "カオス", "ネオン王"]),
        });
      }

      for (let i = 0; i < 140; i += 1) {
        rain.push({
          x: rand(0, world.w),
          y: rand(0, world.h),
          speed: rand(520, 860),
          len: rand(12, 28),
          alpha: rand(0.12, 0.34),
        });
      }
    }

    function makeMission() {
      const types = [
        { kind: "scout", label: "客を集めろ", target: 5 + Math.floor(wave * 1.5) },
        { kind: "clear", label: "迷惑NPCを退場させろ", target: 3 + Math.floor(wave * 1.2) },
        { kind: "mixed", label: "客引きと退治で街を盛り上げろ", target: 8 + Math.floor(wave * 2) },
      ];
      mission = pick(types);
      scoutedThisWave = 0;
      clearedThisWave = 0;
      upgradedThisWave = 0;
      waveEndsAt = performance.now() + Math.max(38000, 62000 - wave * 1800);
      showToast(`第${wave}波: ${mission.label}`, "#24dbff");
      playSfx("wave");
    }

    function missionProgress() {
      if (!mission) return 0;
      if (mission.kind === "scout") return scoutedThisWave;
      if (mission.kind === "clear") return clearedThisWave;
      return scoutedThisWave + clearedThisWave;
    }

    function completeMission() {
      const reward = 120 + wave * 45 + player.upgradeLevel * 20;
      player.money += reward;
      player.rep += 35 + wave * 12;
      player.combo = Math.min(5, player.combo + 0.6);
      spawnParticle(player.x, player.y - 120, `ミッション達成 +${reward}円`, "#ffe63e");
      showToast(`ミッション達成！ +${reward}円`, "#ffe63e");
      wave += 1;
      makeMission();
    }

    function startNextWave() {
      showToast("時間切れ！ 次の波へ", "#ff742a");
      wave += 1;
      makeMission();
    }

    function upgradeClub() {
      ensureAudio();
      const cost = 90 * player.upgradeLevel;
      if (player.money < cost) {
        showToast(`強化には${cost}円必要`, "#ff742a");
        spawnParticle(player.x, player.y - 80, "資金不足", "#ffffff");
        return;
      }

      player.money -= cost;
      player.upgradeLevel += 1;
      upgradedThisWave += 1;
      player.rep += 10;
      player.combo = Math.min(5, player.combo + 0.2);
      playSfx("upgrade");
      spawnParticle(player.x, player.y - 96, `店演出Lv.${player.upgradeLevel}`, "#24dbff");
      showToast(`店演出を強化！ Lv.${player.upgradeLevel}`, "#24dbff");
    }

    function updateStats() {
      player.club = Math.max(1, Math.floor(player.rep / 180) + 1);
      els.money.textContent = String(player.money);
      els.rep.textContent = String(player.rep);
      els.charisma.textContent = String(player.charisma);
      els.club.textContent = String(player.club);
      els.trouble.textContent = String(player.trouble);
      els.combo.textContent = player.combo.toFixed(1);
      els.saved.textContent = String(savedCustomers);
      els.lost.textContent = String(lostCustomers);
      els.streak.textContent = String(comboStreak);
      if (!mission) makeMission();
      const remaining = Math.max(0, Math.ceil((waveEndsAt - performance.now()) / 1000));
      const progress = missionProgress();
      els.wave.textContent = `第${wave}波 / 残り${remaining}秒 / 演出Lv.${player.upgradeLevel}`;
      els.missionText.textContent = `${mission.label}: ${Math.min(progress, mission.target)} / ${mission.target}`;
      els.missionFill.style.width = `${Math.min(100, (progress / mission.target) * 100)}%`;

      const rows = [
        { name: "あなた", rep: player.rep, trouble: player.trouble },
        ...rankingNames.map((name, i) => ({ name, rep: 380 - i * 58 + Math.floor(performance.now() / 2200) % 20, trouble: 16 - i * 2 })),
      ].sort((a, b) => b.rep - a.rep).slice(0, 5);

      els.ranking.innerHTML = rows.map((row, i) => `
        <div class="rank-row"><span>${i + 1}. ${row.name}</span><span>評判 ${row.rep} / 退治 ${row.trouble}</span></div>
      `).join("");
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function nearestNpc(kind, range) {
      let target = null;
      let best = range;
      const now = performance.now();
      for (const npc of npcs) {
        if (npc.hitUntil > now) continue;
        if (kind && npc.type !== kind) continue;
        const d = distance(player, npc);
        if (d < best) {
          best = d;
          target = npc;
        }
      }
      return target;
    }

    function npcById(id) {
      return npcs.find((npc) => npc.id === id);
    }

    function nearestCustomerFrom(source, range) {
      let target = null;
      let best = range;
      const now = performance.now();
      for (const npc of npcs) {
        if (npc.type !== "customer" || npc.hitUntil > now || npc.harassedBy) continue;
        const d = distance(source, npc);
        if (d < best) {
          best = d;
          target = npc;
        }
      }
      return target;
    }

    function setNpcVelocityToward(npc, x, y, speed) {
      const dx = x - npc.x;
      const dy = y - npc.y;
      const len = Math.hypot(dx, dy) || 1;
      npc.vx = (dx / len) * speed;
      npc.vy = (dy / len) * speed;
    }

    function registerBonkStreak() {
      const now = performance.now();
      comboStreak = now < comboExpiresAt ? comboStreak + 1 : 1;
      comboExpiresAt = now + 2500;
      return comboStreak;
    }

    function clearStreak() {
      comboStreak = 0;
      comboExpiresAt = 0;
    }

    function rescueLinkedCustomer(troubleNpc) {
      const now = performance.now();
      const customer = npcs.find((npc) => npc.type === "customer" && npc.harassedBy === troubleNpc.id);
      if (!customer) return { money: 0, rep: 0 };

      customer.harassedBy = null;
      customer.harassStartedAt = 0;
      customer.savedUntil = now + 900;
      savedCustomers += 1;
      const money = Math.floor((34 + wave * 3) * upgradeBonus());
      const rep = 18 + Math.floor(wave * 1.5);
      spawnParticle(customer.x, customer.y - 66, `救出 +${money}円`, "#5bff7b");
      spawnParticle(customer.x, customer.y - 92, "客を守った!", "#24dbff");
      return { money, rep };
    }

    function customerEscapes(customer, troubleNpc) {
      lostCustomers += 1;
      player.rep = Math.max(0, player.rep - 12);
      player.combo = Math.max(1, player.combo - 0.6);
      clearStreak();
      customer.harassedBy = null;
      customer.harassStartedAt = 0;
      if (troubleNpc) troubleNpc.targetId = null;
      screenShakeUntil = performance.now() + 260;
      screenShakePower = Math.max(screenShakePower, 8);
      spawnParticle(customer.x, customer.y - 64, "客が逃げた! 評判-12", "#ff742a");
      showToast("迷惑NPCを放置して客が逃げた！", "#ff742a");
      resetNpc(customer, "customer");
    }

    function annoyPlayer(npc) {
      const now = performance.now();
      if (npc.nextAnnoyAt > now) return;
      npc.nextAnnoyAt = now + Math.max(620, 1250 - wave * 45);
      player.rep = Math.max(0, player.rep - 5);
      player.combo = Math.max(1, player.combo - 0.35);
      clearStreak();
      screenShakeUntil = now + 180;
      screenShakePower = Math.max(screenShakePower, 6);
      spawnParticle(player.x, player.y - 76, "妨害! 評判-5", "#ff472d");
    }

    function interact() {
      const trouble = nearestNpc("trouble", bonkRange());
      if (trouble) {
        bonk();
        return;
      }
      scout();
    }

    function scout() {
      const target = nearestNpc("customer", scoutRange());
      if (!target) return;

      const bonus = chaosUntil > performance.now() ? 2 : 1;
      const money = Math.floor((18 + player.club * 2) * player.combo * bonus * upgradeBonus());
      const rep = Math.floor((6 + player.club) * player.combo * bonus * upgradeBonus());
      player.money += money;
      player.rep += rep;
      scoutedThisWave += 1;
      if (Math.random() < 0.28) player.charisma += 1;
      player.combo = Math.min(3, player.combo + 0.1);
      spawnParticle(target.x, target.y, `+${money}円 評判+${rep}`, "#ffe63e");
      spawnParticle((player.x + target.x) / 2, (player.y + target.y) / 2 - 22, "来店!", "#24dbff");
      showToast(`客引き成功: ${target.label}`, "#24dbff");
      playSfx("scout");
      lastInteraction = { type: "scout", x1: player.x, y1: player.y - 54, x2: target.x, y2: target.y - 70, until: performance.now() + 520 };
      resetNpc(target, "customer");
      if (mission && missionProgress() >= mission.target) completeMission();
    }

    function bonk() {
      const now = performance.now();
      if (bonkCooldown > now) return;
      bonkCooldown = now + 500;

      let hit = false;
      for (const npc of npcs) {
        if (npc.type !== "trouble" || npc.hitUntil > now) continue;
        const d = distance(player, npc);
        if (d > bonkRange()) continue;
        const dx = npc.x - player.x || Math.cos(player.facing);
        const dy = npc.y - player.y || Math.sin(player.facing);
        const len = Math.hypot(dx, dy) || 1;
        if (d > 74) {
          player.x += (dx / len) * Math.min(42, d - 74);
          player.y += (dy / len) * Math.min(42, d - 74);
        }
        npc.knockX = (dx / len) * 170;
        npc.knockY = (dy / len) * 170 - 60;
        npc.hitUntil = now + 460;
        const streak = registerBonkStreak();
        const rescue = rescueLinkedCustomer(npc);
        const points = npc.label === "クソ客" ? 2 : 1;
        const streakBonus = Math.min(34, Math.max(0, streak - 1) * 5);
        player.trouble += points;
        clearedThisWave += points;
        player.rep += (npc.label === "クソ客" ? 16 : 11) + rescue.rep + Math.floor(streakBonus * 0.45);
        player.money += Math.floor((10 + rescue.money + streakBonus) * upgradeBonus());
        player.combo = Math.min(5, player.combo + 0.28);
        spawnHitImpact(npc.x, npc.y, npc.label, points);
        spawnParticle((player.x + npc.x) / 2, (player.y + npc.y) / 2 - 36, "ドンッ!", "#ff472d");
        if (streak >= 2) spawnParticle(npc.x, npc.y - 106, `${streak}連続退治!`, "#ffe63e");
        showToast(`${npc.label}をツッコミ退場！ ${streak}連続`, "#ff472d");
        lastInteraction = { type: "bonk", x1: player.x, y1: player.y - 48, x2: npc.x, y2: npc.y - 58, until: now + 320 };
        if (mission && missionProgress() >= mission.target) completeMission();
        hit = true;
      }

      if (!hit) {
        spawnParticle(player.x + Math.cos(player.facing) * 34, player.y + Math.sin(player.facing) * 34, "スカッ", "#ffffff");
      }
    }

    function dash() {
      const now = performance.now();
      if (dashCooldown > now) return;
      dashUntil = now + 320;
      dashCooldown = now + 1600;
      showToast("ダッシュ！", "#24dbff");
    }

    function pose() {
      poseUntil = performance.now() + 900;
      player.rep += 3;
      player.combo = Math.min(3, player.combo + 0.05);
      showToast("ネオンポーズ！ 評判+3", "#ff2a91");
    }

    function startChaos() {
      chaosUntil = performance.now() + 9000;
      nextChaos = rand(18, 28);
      showToast("札束の雨！ 報酬2倍！", "#ffe63e");
      for (let i = 0; i < 60; i += 1) {
        particles.push({ x: rand(100, world.w - 100), y: rand(80, world.h - 120), text: "¥", color: "#ffe63e", life: rand(0.6, 1.2), vy: rand(24, 80), vx: rand(-18, 18) });
      }
    }

    function inputVector() {
      let x = touchMove.x;
      let y = touchMove.y;
      if (keys.has("arrowleft") || keys.has("a")) x -= 1;
      if (keys.has("arrowright") || keys.has("d")) x += 1;
      if (keys.has("arrowup") || keys.has("w")) y -= 1;
      if (keys.has("arrowdown") || keys.has("s")) y += 1;
      if (Math.hypot(x, y) < 0.05 && moveTarget) {
        const dx = moveTarget.x - player.x;
        const dy = moveTarget.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 18) {
          moveTarget = null;
        } else {
          x = dx / dist;
          y = dy / dist;
        }
      } else if (Math.hypot(x, y) > 0.05) {
        moveTarget = null;
      }
      const len = Math.hypot(x, y);
      if (len > 1) return { x: x / len, y: y / len };
      return { x, y };
    }

    function update(dt) {
      const now = performance.now();
      if (now < hitStopUntil) {
        dt *= 0.08;
      }
      const move = inputVector();
      const speed = dashUntil > now ? 560 : 285;
      playerMoving = Math.hypot(move.x, move.y) > 0.05;
      if (playerMoving) {
        playerWalkTime += dt * (dashUntil > now ? 18 : 10);
      }
      if (playerMoving && dashUntil > now && Math.random() < 0.45) {
        afterImages.push({ x: player.x, y: player.y, facing: player.facing, life: 0.28 });
      }
      player.x = Math.max(roadLeft() + 20, Math.min(roadRight() - 20, player.x + move.x * speed * dt));
      player.y = Math.max(80, Math.min(world.h - 70, player.y + move.y * speed * dt));
      if (playerMoving) player.facing = Math.atan2(move.y, move.x);

      player.combo = Math.max(1, player.combo - dt * 0.06);
      if (comboStreak > 0 && now > comboExpiresAt) clearStreak();
      nextChaos -= dt;
      if (nextChaos <= 0) startChaos();
      if (mission && performance.now() > waveEndsAt) startNextWave();

      for (const npc of npcs) {
        if (npc.hitUntil > now) {
          npc.x += npc.knockX * dt;
          npc.y += npc.knockY * dt;
          npc.knockY += 460 * dt;
          continue;
        } else if (npc.hitUntil !== 0) {
          resetNpc(npc, npc.type);
          continue;
        }

        if (npc.type === "customer" && npc.harassedBy) {
          const troubleNpc = npcById(npc.harassedBy);
          if (!troubleNpc || troubleNpc.hitUntil > now) {
            npc.harassedBy = null;
            npc.harassStartedAt = 0;
          } else if (distance(npc, troubleNpc) > 175) {
            npc.harassedBy = null;
            npc.harassStartedAt = 0;
          } else if (now - npc.harassStartedAt > Math.max(1300, 3000 - wave * 90)) {
            customerEscapes(npc, troubleNpc);
            continue;
          } else {
            const dx = npc.x - troubleNpc.x;
            const dy = npc.y - troubleNpc.y;
            const len = Math.hypot(dx, dy) || 1;
            npc.vx = (dx / len) * 30;
            npc.vy = (dy / len) * 30;
          }
        }

        if (npc.type === "trouble") {
          const playerDistance = distance(player, npc);
          const targetedCustomer = npc.targetId ? npcById(npc.targetId) : null;
          const nearbyCustomer = targetedCustomer && targetedCustomer.type === "customer" && !targetedCustomer.harassedBy
            ? targetedCustomer
            : nearestCustomerFrom(npc, 210 + wave * 8);

          if (playerDistance < 54) {
            annoyPlayer(npc);
          }

          if (playerDistance < 210) {
            npc.aiMode = "huntPlayer";
            setNpcVelocityToward(npc, player.x, player.y, 72 + wave * 4);
          } else if (nearbyCustomer) {
            npc.aiMode = "harassCustomer";
            npc.targetId = nearbyCustomer.id;
            setNpcVelocityToward(npc, nearbyCustomer.x, nearbyCustomer.y, 58 + wave * 3);
            if (distance(npc, nearbyCustomer) < 52) {
              nearbyCustomer.harassedBy = npc.id;
              nearbyCustomer.harassStartedAt = nearbyCustomer.harassStartedAt || now;
              spawnParticle(nearbyCustomer.x, nearbyCustomer.y - 70, "救出!", "#ffef63");
            }
          } else if (Math.random() < 0.012) {
            npc.aiMode = "wander";
            npc.vx = rand(-42, 42);
            npc.vy = rand(-34, 34);
          }
        }

        npc.x += npc.vx * dt;
        npc.y += npc.vy * dt;
        npc.x = Math.max(roadLeft() + 18, Math.min(roadRight() - 18, npc.x));
        npc.y = Math.max(105, Math.min(world.h - 105, npc.y));
        if (npc.x < roadLeft() + 20 || npc.x > roadRight() - 20) npc.vx *= -1;
        if (npc.y < 120 || npc.y > world.h - 120) npc.vy *= -1;
        if (npc.type !== "trouble" && Math.random() < 0.01) {
          npc.vx = rand(-36, 36);
          npc.vy = rand(-30, 30);
        }
      }

      for (const drop of rain) {
        drop.y += drop.speed * dt;
        drop.x -= drop.speed * dt * 0.18;
        if (drop.y > world.h + 80 || drop.x < -80) {
          drop.y = rand(-160, 0);
          drop.x = rand(0, world.w);
        }
      }

      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
        shockwaves[i].life -= dt;
        if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
      }

      for (let i = hitSparks.length - 1; i >= 0; i -= 1) {
        const spark = hitSparks[i];
        spark.life -= dt;
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
        spark.vy += 260 * dt;
        if (spark.life <= 0) hitSparks.splice(i, 1);
      }

      for (let i = afterImages.length - 1; i >= 0; i -= 1) {
        afterImages[i].life -= dt;
        if (afterImages[i].life <= 0) afterImages.splice(i, 1);
      }

      if (toastUntil < now) els.toast.classList.remove("show");
      updateStats();
    }

    function camera() {
      const marginX = Math.min(260, window.innerWidth * 0.28);
      const marginY = Math.min(180, window.innerHeight * 0.26);
      const screenX = player.x - cameraState.x;
      const screenY = player.y - cameraState.y;

      if (screenX < marginX) cameraState.x = player.x - marginX;
      if (screenX > window.innerWidth - marginX) cameraState.x = player.x - (window.innerWidth - marginX);
      if (screenY < marginY) cameraState.y = player.y - marginY;
      if (screenY > window.innerHeight - marginY) cameraState.y = player.y - (window.innerHeight - marginY);

      cameraState.x = Math.max(0, Math.min(world.w - window.innerWidth, cameraState.x));
      cameraState.y = Math.max(0, Math.min(world.h - window.innerHeight, cameraState.y));
      return cameraState;
    }

    function drawRoundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBuilding(building) {
      const x = building.x;
      const y = building.y;
      const w = building.w;
      const h = building.h;
      const sideDepth = building.side * 24;
      const body = ctx.createLinearGradient(x, y - h, x + w, y);
      body.addColorStop(0, "#10111c");
      body.addColorStop(0.55, "#1b1c2a");
      body.addColorStop(1, "#090a11");

      ctx.save();
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y - h);
      ctx.lineTo(x + w, y - h - 16);
      ctx.lineTo(x + w + sideDepth, y - 10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.10)";
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.beginPath();
      ctx.moveTo(x + w, y - h - 16);
      ctx.lineTo(x + w + sideDepth, y - 10);
      ctx.lineTo(x + w + sideDepth, y + 2);
      ctx.lineTo(x + w, y);
      ctx.closePath();
      ctx.fill();

      for (const windowInfo of building.windows) {
        const wx = x + windowInfo.x;
        const wy = y - h + windowInfo.y;
        ctx.fillStyle = windowInfo.on ? windowInfo.color : "rgba(255,255,255,0.07)";
        ctx.shadowBlur = windowInfo.on ? 10 : 0;
        ctx.shadowColor = windowInfo.color;
        ctx.fillRect(wx, wy, 14, 18);
      }
      ctx.shadowBlur = 0;

      ctx.fillStyle = building.color;
      ctx.shadowBlur = 18;
      ctx.shadowColor = building.color;
      drawRoundRect(x + 18, y - h + 18, Math.min(150, w - 36), 34, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = building.color === "#ffe63e" || building.color === "#5bff7b" ? "#111" : "#fff";
      ctx.font = "900 15px Arial";
      ctx.textAlign = "center";
      ctx.fillText(building.label, x + 18 + Math.min(150, w - 36) / 2, y - h + 40);
      ctx.restore();
    }

    function drawGround(cam) {
      const roadLeft = world.w / 2 - 270;
      const roadRight = world.w / 2 + 270;
      const sideLeft = world.w / 2 - 380;
      const sideRight = world.w / 2 + 380;

      const asphalt = ctx.createLinearGradient(0, -cam.y, 0, world.h - cam.y);
      asphalt.addColorStop(0, "#343541");
      asphalt.addColorStop(0.55, "#1f2028");
      asphalt.addColorStop(1, "#09090d");
      ctx.globalAlpha = cityBackground.complete && cityBackground.naturalWidth > 0 ? 0.72 : 1;
      ctx.fillStyle = asphalt;
      ctx.fillRect(roadLeft, 0, roadRight - roadLeft, world.h);

      ctx.globalAlpha = cityBackground.complete && cityBackground.naturalWidth > 0 ? 0.42 : 1;
      ctx.fillStyle = "#30313a";
      ctx.fillRect(sideLeft, 0, roadLeft - sideLeft, world.h);
      ctx.fillRect(roadRight, 0, sideRight - roadRight, world.h);
      ctx.globalAlpha = 1;

      ctx.fillStyle = "rgba(255,255,255,0.07)";
      for (let y = 0; y < world.h; y += 44) {
        ctx.fillRect(sideLeft, y, roadLeft - sideLeft, 1);
        ctx.fillRect(roadRight, y, sideRight - roadRight, 1);
      }

      ctx.fillStyle = "#ffe63e";
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#ffe63e";
      for (let y = 40; y < world.h; y += 84) ctx.fillRect(world.w / 2 - 7, y, 14, 42);
      ctx.shadowBlur = 0;

      for (let y = 80; y < world.h; y += 170) {
        const reflection = ctx.createLinearGradient(world.w / 2 - 180, y, world.w / 2 + 180, y + 70);
        reflection.addColorStop(0, "rgba(255,42,145,0)");
        reflection.addColorStop(0.45, "rgba(255,42,145,0.20)");
        reflection.addColorStop(1, "rgba(36,219,255,0)");
        ctx.fillStyle = reflection;
        ctx.beginPath();
        ctx.ellipse(world.w / 2 + Math.sin(y) * 90, y + 50, 170, 28, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGeneratedBackground(cam) {
      if (!cityBackground.complete || cityBackground.naturalWidth === 0) return false;

      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      const imgW = cityBackground.naturalWidth;
      const imgH = cityBackground.naturalHeight;
      const imgRatio = imgW / imgH;
      const viewRatio = viewportW / viewportH;

      let sx = 0;
      let sy = 0;
      let sw = imgW;
      let sh = imgH;

      if (imgRatio > viewRatio) {
        sw = imgH * viewRatio;
        sx = (imgW - sw) * (cam.x / Math.max(1, world.w - viewportW));
      } else {
        sh = imgW / viewRatio;
        sy = (imgH - sh) * (cam.y / Math.max(1, world.h - viewportH));
      }

      ctx.drawImage(cityBackground, sx, sy, sw, sh, 0, 0, viewportW, viewportH);

      const shade = ctx.createLinearGradient(0, 0, 0, viewportH);
      shade.addColorStop(0, "rgba(5, 5, 12, 0.16)");
      shade.addColorStop(0.52, "rgba(0, 0, 0, 0.10)");
      shade.addColorStop(1, "rgba(0, 0, 0, 0.34)");
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, viewportW, viewportH);
      return true;
    }

    function drawNpc(npc, cam) {
      const x = npc.x - cam.x;
      const y = npc.y - cam.y;
      const sprite = npc.type === "trouble"
        ? (npc.variant === "female" ? sprites.troubleFemale : sprites.trouble)
        : (npc.variant === "female" ? sprites.customerFemale : sprites.customer);
      const now = performance.now();
      const isHit = npc.hitUntil > now;
      const harassed = npc.type === "customer" && npc.harassedBy;
      const active = nearestNpc(npc.type, npc.type === "trouble" ? bonkRange() : scoutRange()) === npc;

      ctx.save();
      if (isHit) {
        ctx.translate(x, y);
        ctx.rotate(Math.sin(now / 40) * 0.32);
        ctx.translate(-x, -y);
      }
      ctx.fillStyle = "rgba(0,0,0,0.34)";
      ctx.beginPath();
      ctx.ellipse(x, y + npc.r * 1.35, npc.r * 1.35, npc.r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      if (active || harassed || npc.savedUntil > now) {
        ctx.strokeStyle = harassed ? "#ff472d" : (npc.savedUntil > now ? "#5bff7b" : (npc.type === "trouble" ? "#ffef63" : "#24dbff"));
        ctx.lineWidth = 3;
        ctx.shadowBlur = 14;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        ctx.arc(x, y + 4, harassed ? 52 + Math.sin(now / 90) * 5 : (npc.type === "trouble" ? 46 : 40), 0, Math.PI * 2);
        ctx.stroke();
      }

      if (sprite.complete && sprite.naturalWidth > 0) {
        const size = npc.type === "trouble" ? 108 : 102;
        const aspect = sprite.naturalWidth / sprite.naturalHeight;
        const drawH = size;
        const drawW = drawH * aspect;
        const bob = Math.sin((performance.now() / 250) + npc.x * 0.01) * 3;
        ctx.shadowBlur = 22;
        ctx.shadowColor = npc.type === "trouble" ? "#ff472d" : "#24dbff";
        ctx.drawImage(sprite, x - drawW / 2, y - drawH + 30 + bob, drawW, drawH);
        ctx.shadowBlur = 0;
      } else {
        ctx.shadowBlur = 16;
        ctx.shadowColor = npc.color;
        ctx.fillStyle = npc.color;
        drawRoundRect(x - npc.r, y - npc.r * 1.4, npc.r * 2, npc.r * 2.8, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if ((active || harassed) && !isHit) {
        ctx.font = "900 13px Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = harassed ? "#ffef63" : (npc.type === "trouble" ? "#ffe63e" : "#ffffff");
        ctx.strokeStyle = "rgba(0,0,0,0.72)";
        ctx.lineWidth = 4;
        const actionText = harassed ? "救出!" : (npc.type === "trouble" ? "ツッコミ" : "客引き");
        ctx.strokeText(actionText, x, y - npc.r * 2.6);
        ctx.fillText(actionText, x, y - npc.r * 2.6);

        ctx.font = "900 12px Arial";
        ctx.strokeText(npc.label, x, y + 44);
        ctx.fillStyle = npc.type === "trouble" ? "#ffef63" : "#dffcff";
        ctx.fillText(npc.label, x, y + 44);
      }
      ctx.restore();
    }

    function drawPlayer(cam) {
      const x = player.x - cam.x;
      const y = player.y - cam.y;
      const bob = playerMoving ? Math.sin(playerWalkTime) * 5 : Math.sin(performance.now() / 420) * 1.4;
      const tilt = playerMoving ? Math.sin(playerWalkTime * 0.5) * 0.08 : 0;
      const lean = playerMoving ? Math.cos(player.facing) * 5 : 0;

      for (const ghost of afterImages) {
        if (!sprites.player.complete || sprites.player.naturalWidth === 0) continue;
        const gx = ghost.x - cam.x;
        const gy = ghost.y - cam.y;
        const drawH = 116;
        const drawW = drawH * (sprites.player.naturalWidth / sprites.player.naturalHeight);
        ctx.save();
        ctx.globalAlpha = Math.max(0, ghost.life / 0.28) * 0.32;
        ctx.translate(gx, gy);
        ctx.rotate(ghost.facing + tilt);
        ctx.shadowBlur = 24;
        ctx.shadowColor = "#24dbff";
        ctx.drawImage(sprites.player, -drawW / 2, -drawH + 38, drawW, drawH);
        ctx.restore();
      }

      ctx.save();
      ctx.translate(x + lean, y + bob);
      ctx.rotate(player.facing + tilt);
      ctx.strokeStyle = "rgba(255,230,62,0.82)";
      ctx.lineWidth = 3;
      ctx.shadowBlur = 18;
      ctx.shadowColor = "#ffe63e";
      ctx.beginPath();
      ctx.arc(0, 0, 34 + Math.min(18, player.upgradeLevel * 2), 0, Math.PI * 2);
      ctx.stroke();
      if (comboStreak >= 2 && performance.now() < comboExpiresAt) {
        ctx.strokeStyle = "#ff472d";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 24;
        ctx.shadowColor = "#ff472d";
        ctx.beginPath();
        ctx.arc(0, 0, 44 + Math.sin(performance.now() / 80) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,0,0,0.38)";
      ctx.beginPath();
      ctx.ellipse(0, 31, 31, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      if (sprites.player.complete && sprites.player.naturalWidth > 0) {
        const drawH = poseUntil > performance.now() ? 126 : 116;
        const drawW = drawH * (sprites.player.naturalWidth / sprites.player.naturalHeight);
        ctx.rotate(-(player.facing + tilt));
        ctx.shadowBlur = poseUntil > performance.now() ? 34 : 24;
        ctx.shadowColor = "#ff2a91";
        ctx.drawImage(sprites.player, -drawW / 2, -drawH + 38, drawW, drawH);
        ctx.shadowBlur = 0;
      } else {
        ctx.shadowBlur = poseUntil > performance.now() ? 30 : 18;
        ctx.shadowColor = "#ff2a91";
        ctx.fillStyle = "#ff2a91";
        drawRoundRect(-19, -27, 38, 56, 10);
        ctx.fill();
        ctx.fillStyle = "#ffe63e";
        ctx.fillRect(-17, -27, 34, 13);
        ctx.shadowBlur = 0;
      }
      if (dashUntil > performance.now()) {
        ctx.strokeStyle = "#24dbff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-52, 0);
        ctx.lineTo(-20, 0);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.font = "900 14px Arial";
      ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,0.84)";
      ctx.lineWidth = 4;
      ctx.strokeText("あなた", x, y - 74 + bob);
      ctx.fillStyle = "#ffe63e";
      ctx.fillText("あなた", x, y - 74 + bob);
      ctx.restore();

      if (playerMoving) {
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.strokeStyle = dashUntil > performance.now() ? "#24dbff" : "#ffe63e";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.strokeStyle;
        for (let i = 0; i < 3; i += 1) {
          const offset = (i - 1) * 10;
          ctx.beginPath();
          ctx.moveTo(x - Math.cos(player.facing) * (28 + i * 8), y + 22 + offset * 0.1);
          ctx.lineTo(x - Math.cos(player.facing) * (52 + i * 10), y + 22 + offset);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function render() {
      const cam = camera();
      const now = performance.now();
      let shakeX = 0;
      let shakeY = 0;
      if (screenShakeUntil > now) {
        const t = (screenShakeUntil - now) / 360;
        shakeX = rand(-screenShakePower, screenShakePower) * t;
        shakeY = rand(-screenShakePower, screenShakePower) * t;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const hasGeneratedBackground = drawGeneratedBackground(cam);

      if (!hasGeneratedBackground) {
        const gradient = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        gradient.addColorStop(0, "#101024");
        gradient.addColorStop(0.5, "#080914");
        gradient.addColorStop(1, "#050507");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      }

      for (let i = 0; i < 40; i += 1) {
        const sx = (i * 97 - cam.x * 0.2) % window.innerWidth;
        const sy = (i * 41 - cam.y * 0.2) % Math.max(window.innerHeight, 1);
        ctx.fillStyle = i % 2 ? "rgba(36,219,255,0.12)" : "rgba(255,42,145,0.12)";
        ctx.fillRect(sx, sy, 2, 2);
      }

      ctx.save();
      ctx.translate(-cam.x, -cam.y);
      drawGround(cam);

      if (!hasGeneratedBackground) {
        for (const building of buildings) {
          drawBuilding(building);
        }
      }

      if (moveTarget) {
        const pulse = 0.65 + Math.sin(performance.now() / 120) * 0.25;
        ctx.save();
        ctx.strokeStyle = "#24dbff";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#24dbff";
        ctx.globalAlpha = pulse;
        ctx.beginPath();
        ctx.arc(moveTarget.x, moveTarget.y, 24, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(moveTarget.x - 16, moveTarget.y);
        ctx.lineTo(moveTarget.x + 16, moveTarget.y);
        ctx.moveTo(moveTarget.x, moveTarget.y - 16);
        ctx.lineTo(moveTarget.x, moveTarget.y + 16);
        ctx.stroke();
        ctx.restore();
      }

      for (let y = 120; y < world.h; y += 260) {
        for (const gateColor of ["#24dbff", "#ff2a91"]) {
          ctx.strokeStyle = gateColor;
          ctx.lineWidth = 5;
          ctx.shadowBlur = 18;
          ctx.shadowColor = gateColor;
          ctx.beginPath();
          ctx.moveTo(world.w / 2 - 250, y);
          ctx.lineTo(world.w / 2 - 250, y - 92);
          ctx.lineTo(world.w / 2 + 250, y - 92);
          ctx.lineTo(world.w / 2 + 250, y);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }

      if (!hasGeneratedBackground) {
        for (const sign of signs) {
          ctx.save();
          ctx.shadowBlur = 22;
          ctx.shadowColor = sign.color;
          ctx.fillStyle = sign.color;
          drawRoundRect(sign.x, sign.y, sign.w, sign.h, 7);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = sign.color === "#ffe63e" || sign.color === "#5bff7b" ? "#111" : "#fff";
          ctx.font = "900 18px Arial";
          ctx.textAlign = "center";
          ctx.fillText(sign.text, sign.x + sign.w / 2, sign.y + sign.h / 2 + 6);
          ctx.restore();
        }
      }

      const sorted = [...npcs].sort((a, b) => a.y - b.y);
      for (const npc of sorted) drawNpc(npc, { x: 0, y: 0 });
      drawPlayer({ x: 0, y: 0 });

      for (const wave of shockwaves) {
        const progress = 1 - wave.life / wave.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.strokeStyle = wave.color;
        ctx.lineWidth = 8 * (1 - progress) + 2;
        ctx.shadowBlur = 24;
        ctx.shadowColor = wave.color;
        ctx.beginPath();
        ctx.arc(wave.x, wave.y, 24 + progress * 110, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (const spark of hitSparks) {
        const alpha = Math.max(0, spark.life / spark.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = spark.color;
        ctx.lineWidth = 4;
        ctx.shadowBlur = 16;
        ctx.shadowColor = spark.color;
        ctx.beginPath();
        ctx.moveTo(spark.x, spark.y);
        ctx.lineTo(spark.x - spark.vx * 0.045, spark.y - spark.vy * 0.045);
        ctx.stroke();
        ctx.restore();
      }

      if (lastInteraction && lastInteraction.until > performance.now()) {
        const alpha = (lastInteraction.until - performance.now()) / 520;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.strokeStyle = lastInteraction.type === "bonk" ? "#ffef63" : "#24dbff";
        ctx.lineWidth = lastInteraction.type === "bonk" ? 7 : 4;
        ctx.shadowBlur = 18;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        ctx.moveTo(lastInteraction.x1, lastInteraction.y1);
        ctx.quadraticCurveTo(
          (lastInteraction.x1 + lastInteraction.x2) / 2,
          Math.min(lastInteraction.y1, lastInteraction.y2) - 38,
          lastInteraction.x2,
          lastInteraction.y2
        );
        ctx.stroke();
        ctx.restore();
      }

      ctx.strokeStyle = "rgba(180,220,255,0.28)";
      ctx.lineWidth = 1;
      for (const drop of rain) {
        ctx.globalAlpha = drop.alpha;
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x - drop.len * 0.25, drop.y + drop.len);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      for (const p of particles) {
        const alpha = Math.max(0, p.life / (p.maxLife || 1));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.font = `900 ${p.size || 20}px Arial`;
        ctx.textAlign = "center";
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.strokeStyle = "rgba(0,0,0,0.80)";
        ctx.lineWidth = 5;
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillText(p.text, p.x, p.y);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      if (finisherText && finisherText.until > now) {
        const remaining = (finisherText.until - now) / 820;
        const scale = 1 + (1 - remaining) * 0.32;
        ctx.save();
        ctx.translate(finisherText.x, finisherText.y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = Math.min(1, remaining * 1.8);
        ctx.font = "900 34px Arial";
        ctx.textAlign = "center";
        ctx.lineWidth = 8;
        ctx.strokeStyle = "rgba(0,0,0,0.86)";
        ctx.fillStyle = "#ffef63";
        ctx.shadowBlur = 24;
        ctx.shadowColor = "#ff472d";
        ctx.strokeText(finisherText.text, 0, 0);
        ctx.fillText(finisherText.text, 0, 0);
        ctx.restore();
      }
      ctx.restore();

      if (chaosUntil > performance.now()) {
        ctx.fillStyle = "rgba(255,230,62,0.08)";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      }
      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    function bindInput() {
      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        keys.add(key);
        if (key === "shift") dash();
        if (key === " " || key === "f") bonk();
        if (key === "e") interact();
        if (key === "g") pose();
      });

      window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
      els.dash.addEventListener("pointerdown", dash);
      els.bonk.addEventListener("pointerdown", bonk);
      els.pose.addEventListener("pointerdown", pose);
      els.upgrade.addEventListener("pointerdown", upgradeClub);
      canvas.addEventListener("pointerdown", (event) => {
        const cam = camera();
        const worldX = Math.max(roadLeft() + 20, Math.min(roadRight() - 20, event.clientX + cam.x));
        const worldY = Math.max(80, Math.min(world.h - 70, event.clientY + cam.y));

      const nearTrouble = nearestNpc("trouble", 135);
        const nearCustomer = nearestNpc("customer", 72);
        if (event.clientX > window.innerWidth * 0.62 && (nearTrouble || nearCustomer)) {
          interact();
          return;
        }

        moveTarget = { x: worldX, y: worldY };
        spawnParticle(worldX, worldY - 16, "移動", "#24dbff");
      });

      let stickPointer = null;
      els.stick.addEventListener("pointerdown", (event) => {
        stickPointer = event.pointerId;
        els.stick.setPointerCapture(stickPointer);
      });
      els.stick.addEventListener("pointermove", (event) => {
        if (stickPointer !== event.pointerId) return;
        const rect = els.stick.getBoundingClientRect();
        const dx = event.clientX - (rect.left + rect.width / 2);
        const dy = event.clientY - (rect.top + rect.height / 2);
        const len = Math.hypot(dx, dy) || 1;
        const mag = Math.min(44, len);
        touchMove = { x: (dx / len) * (mag / 44), y: (dy / len) * (mag / 44) };
        els.stick.style.setProperty("--knob-x", `${touchMove.x * 44}px`);
        els.stick.style.setProperty("--knob-y", `${touchMove.y * 44}px`);
      });
      els.stick.addEventListener("pointerup", () => {
        stickPointer = null;
        touchMove = { x: 0, y: 0 };
        els.stick.style.setProperty("--knob-x", "0px");
        els.stick.style.setProperty("--knob-y", "0px");
      });
    }

    window.addEventListener("resize", resize);
    resize();
    setupWorld();
    bindInput();
    showToast("客を集めて、迷惑NPCを退場させて、ランキング上位を狙え！", "#24dbff");
    requestAnimationFrame(frame);
  </script>
</body>
</html>
